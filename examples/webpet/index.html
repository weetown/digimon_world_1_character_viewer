<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Webpet smoke test</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #1f1f23;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #facc15;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.4 system-ui, sans-serif;
      }
      #drop {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 16px;
        border: 2px dashed var(--muted);
        margin: 16px;
        border-radius: 12px;
      }
      #drop.hidden {
        display: none;
      }
      #drop input {
        display: block;
        margin: 12px auto 0;
      }
      #panel {
        position: fixed;
        left: 16px;
        bottom: 16px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        max-width: calc(100vw - 32px);
      }
      select,
      button {
        background: #27272a;
        color: var(--fg);
        border: 1px solid var(--muted);
        border-radius: 6px;
        padding: 6px 10px;
        font: inherit;
      }
      button:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      #status {
        position: fixed;
        left: 16px;
        top: 16px;
        color: var(--muted);
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="drop">
      <div>
        <p>
          Drop an export zip from the viewer here (e.g. <code>003_Agumon.zip</code>),<br />
          or a <code>.glb</code> from DW1ModelConverter / dw2_model_converter.
        </p>
        <p>No game files ship with this example; bring your own.</p>
        <input id="file" type="file" accept=".zip,.glb,.gltf" />
      </div>
    </div>
    <div id="status" aria-live="polite"></div>
    <div id="panel" hidden>
      <label>
        Clip
        <select id="clips"></select>
      </label>
      <button id="loop">Loop: on</button>
      <button id="motion">Reduce motion: off</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
